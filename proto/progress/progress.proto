syntax = "proto3";

package progress;

option go_package = "github.com/synapseai/platform/proto/progress";

service ProgressService {
  rpc GetUserProgress(GetUserProgressRequest) returns (GetUserProgressResponse);
  rpc AddXP(AddXPRequest) returns (AddXPResponse);
  rpc GetStreak(GetStreakRequest) returns (GetStreakResponse);
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetAchievements(GetAchievementsRequest) returns (GetAchievementsResponse);
}

message GetUserProgressRequest {
  string user_id = 1;
}

message GetUserProgressResponse {
  string user_id = 1;
  int32 total_xp = 2;
  int32 level = 3;
  int32 current_streak = 4;
  int32 longest_streak = 5;
  int32 quizzes_completed = 6;
  int32 content_uploaded = 7;
  string last_activity = 8;
}

message AddXPRequest {
  string user_id = 1;
  int32 xp_amount = 2;
  string activity_type = 3;
  string reference_id = 4;
}

message AddXPResponse {
  bool success = 1;
  int32 new_total_xp = 2;
  int32 new_level = 3;
  bool level_up = 4;
  string message = 5;
}

message GetStreakRequest {
  string user_id = 1;
}

message GetStreakResponse {
  int32 current_streak = 1;
  int32 longest_streak = 2;
  string last_activity_date = 3;
  bool active_today = 4;
}

message GetLeaderboardRequest {
  int32 limit = 1;
  string period = 2; // "week", "month", "all_time"
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
}

message LeaderboardEntry {
  int32 rank = 1;
  string user_id = 2;
  string username = 3;
  int32 xp = 4;
  int32 level = 5;
  string avatar_url = 6;
}

message GetAchievementsRequest {
  string user_id = 1;
}

message GetAchievementsResponse {
  repeated Achievement achievements = 1;
  int32 total_unlocked = 2;
}

message Achievement {
  string achievement_id = 1;
  string title = 2;
  string description = 3;
  string icon = 4;
  bool unlocked = 5;
  string unlocked_at = 6;
  int32 xp_reward = 7;
}
