syntax = "proto3";

package content;

option go_package = "github.com/synapseai/platform/proto/content";

service ContentService {
  rpc GetContent(GetContentRequest) returns (GetContentResponse);
  rpc ListContent(ListContentRequest) returns (ListContentResponse);
  rpc DeleteContent(DeleteContentRequest) returns (DeleteContentResponse);
  rpc GetContentMetadata(GetContentMetadataRequest) returns (GetContentMetadataResponse);
}

message GetContentRequest {
  string content_id = 1;
  string user_id = 2;
}

message GetContentResponse {
  string content_id = 1;
  string user_id = 2;
  string title = 3;
  string file_path = 4;
  string file_type = 5;
  int64 file_size = 6;
  string description = 7;
  repeated string tags = 8;
  string uploaded_at = 9;
}

message ListContentRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListContentResponse {
  repeated ContentItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ContentItem {
  string content_id = 1;
  string title = 2;
  string file_type = 3;
  int64 file_size = 4;
  string uploaded_at = 5;
  repeated string tags = 6;
}

message DeleteContentRequest {
  string content_id = 1;
  string user_id = 2;
}

message DeleteContentResponse {
  bool success = 1;
  string message = 2;
}

message GetContentMetadataRequest {
  string content_id = 1;
}

message GetContentMetadataResponse {
  string content_id = 1;
  string title = 2;
  string description = 3;
  int32 page_count = 4;
  string language = 5;
  repeated string keywords = 6;
}
